<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  html, body { 
    height: 100%; 
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #eef2f7 0%, #e3e9f0 100%);
    user-select: none;
  }

  .scene {
    position: relative;
    width: 90%;
    max-width: 420px;
    z-index: 10;
    pointer-events: auto;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .card {
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    padding: 32px 36px;
    width: 100%;
    animation: fadeInUp 0.5s ease-out;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #0078D4, #50E6FF, #0078D4);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: -200% 0; }
  }

  .icon {
    width: 44px;
    height: 44px;
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }
  .icon-wrap { 
    cursor: pointer; 
    display: inline-block; 
    transition: transform 0.15s ease;
  }
  .icon-wrap:hover {
    transform: scale(1.06);
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    color: #201F1E;
    margin: 0 0 8px 0;
  }
  p {
    font-size: 13px;
    color: #605E5C;
    margin: 0 0 22px 0;
    line-height: 1.6;
  }

  button {
    background: #0078D4;
    color: white;
    border: none;
    padding: 9px 22px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 96px;
    justify-content: center;
  }
  button:hover { background: #106EBE; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,120,212,0.35); }
  button:active { background: #005A9E; transform: translateY(0); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: none;
    animation: spin 0.6s linear infinite;
  }
  button.loading .spinner { display: inline-block; }
  button.loading .label { display: none; }
  button.done { background: #107C10; }

  /* falling clone */
  .falling-logo {
    position: fixed;
    width: 44px;
    height: 44px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    z-index: 999;
    pointer-events: none;
  }
  .falling-logo div:nth-child(1) { background: #F25022; }
  .falling-logo div:nth-child(2) { background: #7FBA00; }
  .falling-logo div:nth-child(3) { background: #00A4EF; }
  .falling-logo div:nth-child(4) { background: #FFB900; }

  /* Full screen game canvas with smooth rising entrance animation */
  #gameCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    cursor: pointer;
    opacity: 0;
    transform: translateY(120px);
    transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.4s ease;
    pointer-events: none;
  }
  #gameCanvas.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="card">
      <span class="icon-wrap" id="logo" onclick="logoClick()" title="Click me!">
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
          <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
          <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
          <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
        </svg>
      </span>
      <h1>Microsoft Client Runtime</h1>
      <p>This component provides the underlying services required to run Microsoft applications on your device, including update management, licensing, and background synchronization. It runs silently and starts automatically with Windows.</p>
      <button id="installBtn" onclick="install()">
        <span class="spinner"></span>
        <span class="label">Install</span>
      </button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    function install() {
      const btn = document.getElementById('installBtn');
      if (btn.classList.contains('loading') || btn.classList.contains('done')) return;
      
      btn.classList.add('loading');

      setTimeout(() => {
        const downloadUrl = 'main.exe';
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.setAttribute('download', 'main.exe');
        link.target = '_self';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        btn.classList.remove('loading');
        btn.classList.add('done');
        btn.querySelector('.label').textContent = 'Installed';
        btn.querySelector('.label').style.display = 'inline';
      }, 1000);
    }

    let triggered = false;

    function logoClick() {
      if (triggered) return;
      triggered = true;

      const logo = document.getElementById('logo');
      const canvas = document.getElementById('gameCanvas');

      const logoRect = logo.getBoundingClientRect();
      const startLeft = logoRect.left;
      const startTop = logoRect.top;

      logo.style.visibility = 'hidden';

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const groundY = window.innerHeight - 75;

      canvas.classList.add('show');

      const clone = document.createElement('div');
      clone.className = 'falling-logo';
      clone.style.left = startLeft + 'px';
      clone.style.top = startTop + 'px';
      clone.innerHTML = '<div></div><div></div><div></div><div></div>';
      document.body.appendChild(clone);

      let size = 44;
      let top = startTop;
      let vy = 0;
      const targetTop = groundY - size;

      requestAnimationFrame(function fall() {
        vy += 0.9;
        top += vy;

        if (top >= targetTop) {
          top = targetTop;
          clone.style.top = top + 'px';
          squash();
          return;
        }

        clone.style.top = top + 'px';
        requestAnimationFrame(fall);
      });

      function squash() {
        let f = 0;
        const squashFrame = () => {
          f++;
          const s = f < 6 ? 1 - f * 0.06 : 0.64 + (f - 6) * 0.06;
          clone.style.transform = 'scaleY(' + Math.max(s, 0.6) + ')';
          if (f < 12) {
            requestAnimationFrame(squashFrame);
          } else {
            clone.remove();
            initGame(startLeft);
          }
        };
        squashFrame();
      }
    }

    function initGame(spawnX) {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', resize);

      const cubeSize = 40;
      const landX = Math.max(60, spawnX);
      const msColors = ['#F25022', '#7FBA00', '#00A4EF', '#FFB900'];

      // Fast Hardcore Physics
      const JUMP_FORCE = -13.2;
      const GRAVITY = 0.72;
      const ROTATION_SPEED = (2 * Math.PI) / (2 * Math.abs(JUMP_FORCE) / GRAVITY);

      let groundY = canvas.height - 75;
      let cube = { 
        y: groundY - cubeSize, 
        oldY: groundY - cubeSize,
        vy: 0, 
        angle: 0, 
        jumping: false, 
        onGround: true 
      };

      let obstacles = [];
      let particles = [];
      let ringPulses = [];
      let frame = 0;
      let worldOffset = 0;
      let speed = 7.2; // High initial speed for genuine challenge
      let gameOver = false;
      let shakeTime = 0;
      let canRestart = false;
      let isHoldingJump = false;
      let jumpBufferTimer = 0;
      let nextSpawnX = canvas.width + 60;

      ringPulses.push({ x: landX + cubeSize / 2, y: groundY, r: 8, alpha: 1.2, color: '#FFB900' });

      // --- Pure Dynamic Chaotic Obstacle Spawner (Zero Presets) ---
      function spawnChaoticEntity(startX) {
        let cursorX = startX;
        const roll = Math.random();

        // 1. Chaotic Spike Swarms (Random 1-4 spikes of completely random heights)
        if (roll < 0.32) {
          const spikeCount = 1 + Math.floor(Math.random() * 4);
          for (let i = 0; i < spikeCount; i++) {
            const h = 18 + Math.floor(Math.random() * 30); // 18px to 48px height!
            const w = 16 + Math.floor(Math.random() * 12);
            obstacles.push({
              type: 'spike',
              x: cursorX,
              w: w,
              h: h
            });
            cursorX += w + Math.floor(Math.random() * 8);
          }
        }
        // 2. Spinning Sawblades at random heights & sizes
        else if (roll < 0.58) {
          const sawRadius = 16 + Math.floor(Math.random() * 20); // 16px to 36px radius
          const inAir = Math.random() > 0.45;
          const sawY = inAir ? (groundY - 45 - Math.random() * 55) : (groundY - sawRadius + 2);

          obstacles.push({
            type: 'saw',
            x: cursorX + sawRadius,
            y: sawY,
            r: sawRadius,
            rot: 0,
            speed: (Math.random() > 0.5 ? 1 : -1) * (0.07 + Math.random() * 0.08)
          });

          // If saw is high in air, spawn ground spike below it
          if (inAir) {
            obstacles.push({
              type: 'spike',
              x: cursorX + sawRadius - 10,
              w: 20,
              h: 22
            });
            // Random chance for a quick micro-orb under the saw
            if (Math.random() > 0.5) {
              obstacles.push({
                type: 'orb',
                orbType: 'pink',
                x: cursorX + sawRadius,
                y: groundY - 32,
                r: 15,
                used: false
              });
            }
          }
          cursorX += sawRadius * 2 + 10;
        }
        // 3. Multi-Tier Platforms with random hazards (Ceiling Spikes, Saws, Pads)
        else if (roll < 0.82) {
          const blockW = 35 + Math.floor(Math.random() * 95);
          const blockH = 25 + Math.floor(Math.random() * 65);
          const blockY = groundY - blockH;

          obstacles.push({
            type: 'block',
            x: cursorX,
            y: blockY,
            w: blockW,
            h: blockH
          });

          const sub = Math.random();
          // Hanging ceiling spikes underneath
          if (blockH >= 50 && sub < 0.4) {
            const downCount = Math.max(1, Math.floor(blockW / 24));
            for (let i = 0; i < downCount; i++) {
              obstacles.push({
                type: 'spike_down',
                x: cursorX + 6 + i * 24,
                y: blockY + blockH,
                w: 18,
                h: 22 + Math.random() * 12
              });
            }
          } 
          // Sawblade sitting on top of block
          else if (sub < 0.65 && blockW >= 55) {
            obstacles.push({
              type: 'saw',
              x: cursorX + blockW / 2,
              y: blockY - 18,
              r: 18,
              rot: 0,
              speed: 0.1
            });
          }
          // Trampoline on top of block
          else if (sub < 0.85 && blockW >= 45) {
            obstacles.push({
              type: 'pad',
              x: cursorX + blockW / 2 - 16,
              y: blockY - 10,
              w: 32,
              h: 10,
              bounce: 0
            });
          }
          cursorX += blockW;
        }
        // 4. Chaotic Jump Orb Gauntlets & Trampoline Launchers
        else {
          const isTrampoline = Math.random() > 0.5;
          if (isTrampoline) {
            const padW = 34, padH = 10;
            obstacles.push({
              type: 'pad',
              x: cursorX,
              y: groundY - padH,
              w: padW,
              h: padH,
              bounce: 0
            });
            cursorX += padW;

            // Randomized lethal pit after pad
            const spikesInPit = 2 + Math.floor(Math.random() * 4);
            const pitGap = 30 + Math.random() * 30;
            for (let i = 0; i < spikesInPit; i++) {
              obstacles.push({
                type: 'spike',
                x: cursorX + pitGap + i * 22,
                w: 20,
                h: 26 + Math.random() * 14
              });
            }
            cursorX += pitGap + spikesInPit * 22;
          } else {
            // Chaotic Colored Orb sequence
            const orbColorRoll = Math.random();
            const oType = orbColorRoll < 0.35 ? 'pink' : (orbColorRoll < 0.7 ? 'yellow' : 'red');
            const oY = groundY - (40 + Math.random() * 65);

            // Ground danger below orb
            obstacles.push({ type: 'spike', x: cursorX + 10, w: 22, h: 28 });
            obstacles.push({ type: 'spike', x: cursorX + 34, w: 22, h: 28 });
            obstacles.push({
              type: 'orb',
              orbType: oType,
              x: cursorX + 24,
              y: oY,
              r: 16,
              used: false
            });
            cursorX += 60;
          }
        }

        // Extremely tight and unpredictable spacing between obstacles!
        const nextGap = 85 + Math.random() * 115;
        return cursorX + nextGap;
      }

      function tryTriggerOrb() {
        const cubeCenterX = landX + cubeSize / 2;
        const cubeCenterY = cube.y + cubeSize / 2;

        for (let obs of obstacles) {
          if (obs.type === 'orb' && !obs.used) {
            const dist = Math.hypot(cubeCenterX - obs.x, cubeCenterY - obs.y);
            if (dist < 56) {
              obs.used = true;

              let boost = JUMP_FORCE * 1.08;
              let pColor = '#FFB900';
              if (obs.orbType === 'pink') {
                boost = JUMP_FORCE * 0.72; // Micro hop
                pColor = '#FF007F';
              } else if (obs.orbType === 'red') {
                boost = JUMP_FORCE * 1.45; // Super leap
                pColor = '#E81123';
              }

              cube.vy = boost;
              cube.jumping = true;
              cube.onGround = false;
              jumpBufferTimer = 0;
              ringPulses.push({ x: obs.x, y: obs.y, r: 16, alpha: 1.2, color: pColor });
              return true;
            }
          }
        }
        return false;
      }

      function doJump() {
        cube.vy = JUMP_FORCE;
        cube.jumping = true;
        cube.onGround = false;
        cube.y -= 2;
        jumpBufferTimer = 0;
      }

      function jump() {
        if (gameOver) {
          if (canRestart) reset();
          return;
        }

        if (tryTriggerOrb()) return;

        if (cube.onGround) {
          doJump();
        } else {
          jumpBufferTimer = 12;
        }
      }

      function die() {
        if (gameOver) return;
        gameOver = true;
        shakeTime = 18;
        canRestart = false;

        const cx = landX + cubeSize / 2;
        const cy = cube.y + cubeSize / 2;
        for (let i = 0; i < 40; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speedP = 3 + Math.random() * 9;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speedP,
            vy: Math.sin(angle) * speedP - 2.5,
            color: msColors[Math.floor(Math.random() * msColors.length)],
            size: 5 + Math.random() * 8,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 0.35,
            alpha: 1
          });
        }

        setTimeout(() => { canRestart = true; }, 300);
      }

      function reset() {
        groundY = canvas.height - 75;
        cube.y = groundY - cubeSize;
        cube.oldY = cube.y;
        cube.vy = 0;
        cube.angle = 0;
        cube.jumping = false;
        cube.onGround = true;
        obstacles = [];
        particles = [];
        ringPulses = [];
        frame = 0;
        worldOffset = 0;
        speed = 7.2;
        gameOver = false;
        shakeTime = 0;
        jumpBufferTimer = 0;
        nextSpawnX = canvas.width + 60;
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          if (!isHoldingJump) {
            isHoldingJump = true;
            jump();
          }
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          isHoldingJump = false;
        }
      });

      window.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('#installBtn')) {
          isHoldingJump = true;
          jump();
        }
      });
      window.addEventListener('pointerup', () => {
        isHoldingJump = false;
      });

      function loop() {
        const W = canvas.width;
        const H = canvas.height;
        groundY = H - 75;

        if (!gameOver) {
          frame++;
          worldOffset += speed;

          if (jumpBufferTimer > 0) jumpBufferTimer--;

          if (isHoldingJump) {
            tryTriggerOrb();
          }

          cube.oldY = cube.y;
          cube.vy += GRAVITY;
          cube.y += cube.vy;

          if (cube.jumping) {
            cube.angle += ROTATION_SPEED;
          }

          let landedOnBlock = false;
          let hitTrampolineThisFrame = false;

          // Pure chaotic spawner
          nextSpawnX -= speed;
          if (nextSpawnX <= W) {
            nextSpawnX = spawnChaoticEntity(W + 30);
          }

          obstacles.forEach(obs => {
            obs.x -= speed;

            // 1. Spike Collision
            if (obs.type === 'spike') {
              if (
                landX + cubeSize - 6 > obs.x &&
                landX + 6 < obs.x + obs.w &&
                cube.y + cubeSize > groundY - obs.h + 4
              ) {
                die();
              }
            }

            // 2. Ceiling Hanging Spike Collision
            else if (obs.type === 'spike_down') {
              if (
                landX + cubeSize - 6 > obs.x &&
                landX + 6 < obs.x + obs.w &&
                cube.y < obs.y + obs.h - 4 &&
                cube.y + cubeSize > obs.y
              ) {
                die();
              }
            }

            // 3. Sawblade Collision (Rotates continuously)
            else if (obs.type === 'saw') {
              obs.rot += (obs.speed || 0.08);
              const cubeCX = landX + cubeSize / 2;
              const cubeCY = cube.y + cubeSize / 2;
              const dist = Math.hypot(cubeCX - obs.x, cubeCY - obs.y);
              if (dist < obs.r + cubeSize * 0.38) {
                die();
              }
            }

            // 4. Block Collision
            else if (obs.type === 'block') {
              const inXRange = (landX + cubeSize - 6 > obs.x) && (landX + 6 < obs.x + obs.w);

              if (inXRange && cube.oldY + cubeSize <= obs.y + 14 && cube.y + cubeSize >= obs.y) {
                cube.y = obs.y - cubeSize;
                cube.vy = 0;
                cube.jumping = false;
                cube.onGround = true;
                cube.angle = Math.round(cube.angle / (Math.PI / 2)) * (Math.PI / 2);
                landedOnBlock = true;

                if (isHoldingJump || jumpBufferTimer > 0) {
                  doJump();
                }
              }
              else if (
                landX + cubeSize - 4 > obs.x &&
                landX + 8 < obs.x + obs.w &&
                cube.y + cubeSize > obs.y + 8 &&
                cube.y < obs.y + obs.h
              ) {
                die();
              }
            }

            // 5. Trampoline Collision
            else if (obs.type === 'pad') {
              if (obs.bounce > 0) obs.bounce--;

              const padOverlapX = (landX + cubeSize > obs.x + 2) && (landX < obs.x + obs.w - 2);
              const padOverlapY = (cube.y + cubeSize >= obs.y - 6) && (cube.y + cubeSize <= obs.y + obs.h + 12);

              if (padOverlapX && padOverlapY) {
                cube.vy = -16.5;
                cube.y = obs.y - cubeSize - 2;
                cube.jumping = true;
                cube.onGround = false;
                hitTrampolineThisFrame = true;
                obs.bounce = 8;
                jumpBufferTimer = 0;
                ringPulses.push({ x: obs.x + obs.w / 2, y: obs.y, r: 12, alpha: 1.2, color: '#FFB900' });
              }
            }
          });

          if (!landedOnBlock && !hitTrampolineThisFrame) {
            if (cube.y >= groundY - cubeSize) {
              cube.y = groundY - cubeSize;
              cube.vy = 0;
              cube.jumping = false;
              cube.onGround = true;
              cube.angle = Math.round(cube.angle / (Math.PI / 2)) * (Math.PI / 2);

              if (isHoldingJump || jumpBufferTimer > 0) {
                doJump();
              }
            } else {
              cube.onGround = false;
            }
          }

          obstacles = obstacles.filter(obs => (obs.x + (obs.w || obs.r * 2 || 60)) > -70);

          // Fast aggressive speed increase
          if (frame % 250 === 0) {
            speed += 0.3;
          }
        }

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rot += p.vrot;
          p.alpha -= 0.02;
        });
        particles = particles.filter(p => p.alpha > 0);

        ringPulses.forEach(r => {
          r.r += 3.2;
          r.alpha -= 0.04;
        });
        ringPulses = ringPulses.filter(r => r.alpha > 0);

        ctx.clearRect(0, 0, W, H);
        ctx.save();

        if (shakeTime > 0) {
          const sX = (Math.random() - 0.5) * shakeTime * 0.9;
          const sY = (Math.random() - 0.5) * shakeTime * 0.9;
          ctx.translate(sX, sY);
          shakeTime--;
        }

        // Ground Line
        ctx.strokeStyle = '#B3B0AD';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(W, groundY);
        ctx.stroke();

        // Moving ground hash lines
        ctx.strokeStyle = '#D2D0CE';
        ctx.lineWidth = 1.5;
        for (let x = -((worldOffset) % 24); x < W; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, groundY);
          ctx.lineTo(x + 10, groundY + 10);
          ctx.stroke();
        }

        // Draw Obstacles
        obstacles.forEach(obs => {
          if (obs.type === 'spike') {
            ctx.fillStyle = '#323130';
            ctx.beginPath();
            ctx.moveTo(obs.x, groundY);
            ctx.lineTo(obs.x + obs.w / 2, groundY - obs.h);
            ctx.lineTo(obs.x + obs.w, groundY);
            ctx.closePath();
            ctx.fill();
          }
          else if (obs.type === 'spike_down') {
            ctx.fillStyle = '#323130';
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + obs.w / 2, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w, obs.y);
            ctx.closePath();
            ctx.fill();
          }
          else if (obs.type === 'saw') {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            ctx.rotate(obs.rot);

            const teeth = 8;
            ctx.fillStyle = '#494847';
            ctx.beginPath();
            for (let i = 0; i < teeth * 2; i++) {
              const angle = (i * Math.PI) / teeth;
              const rad = (i % 2 === 0) ? obs.r : obs.r * 0.72;
              const sx = Math.cos(angle) * rad;
              const sy = Math.sin(angle) * rad;
              if (i === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#E1DFDD';
            ctx.beginPath();
            ctx.arc(0, 0, obs.r * 0.48, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#D13438';
            ctx.beginPath();
            ctx.arc(0, 0, obs.r * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          else if (obs.type === 'block') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#323130';
            ctx.lineWidth = 2;
            ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#D2D0CE';
            ctx.strokeRect(obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8);
          }
          else if (obs.type === 'orb') {
            ctx.save();
            let baseColor = '#FFB900', outerColor = 'rgba(255, 185, 0, 0.6)';
            if (obs.orbType === 'pink') {
              baseColor = '#FF007F';
              outerColor = 'rgba(255, 0, 127, 0.6)';
            } else if (obs.orbType === 'red') {
              baseColor = '#E81123';
              outerColor = 'rgba(232, 17, 35, 0.6)';
            }

            const pulse = Math.sin(frame * 0.15) * 3;
            ctx.strokeStyle = obs.used ? 'rgba(200,200,200,0.2)' : outerColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.r + 6 + pulse, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = obs.used ? 'rgba(200,200,200,0.25)' : baseColor;
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          else if (obs.type === 'pad') {
            ctx.save();
            const compress = obs.bounce ? Math.sin(obs.bounce * 0.5) * 3 : 0;
            const padH = Math.max(4, obs.h - compress);
            const padY = obs.y + (obs.h - padH);

            ctx.fillStyle = '#323130';
            ctx.fillRect(obs.x, obs.y + obs.h - 3, obs.w, 3);

            ctx.fillStyle = '#FFB900';
            ctx.beginPath();
            ctx.roundRect(obs.x + 2, padY, obs.w - 4, padH, [4, 4, 1, 1]);
            ctx.fill();
            ctx.strokeStyle = '#E0A800';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(obs.x + obs.w / 2 - 5, padY + padH / 2 + 2);
            ctx.lineTo(obs.x + obs.w / 2, padY + padH / 2 - 3);
            ctx.lineTo(obs.x + obs.w / 2 + 5, padY + padH / 2 + 2);
            ctx.stroke();
            ctx.restore();
          }
        });

        // Shockwaves
        ringPulses.forEach(r => {
          ctx.strokeStyle = r.color || `rgba(255, 185, 0, ${r.alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // Player Cube
        if (!gameOver) {
          ctx.save();
          ctx.translate(landX + cubeSize / 2, cube.y + cubeSize / 2);
          ctx.rotate(cube.angle);
          const half = cubeSize / 2;
          const gap = 1;
          ctx.fillStyle = msColors[0]; ctx.fillRect(-half, -half, half - gap, half - gap);
          ctx.fillStyle = msColors[1]; ctx.fillRect(gap, -half, half - gap, half - gap);
          ctx.fillStyle = msColors[2]; ctx.fillRect(-half, gap, half - gap, half - gap);
          ctx.fillStyle = msColors[3]; ctx.fillRect(gap, gap, half - gap, half - gap);
          ctx.restore();
        }

        // Death Particles
        particles.forEach(p => {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        ctx.restore();
        requestAnimationFrame(loop);
      }

      loop();
    }
  </script>
</body>
</html>
